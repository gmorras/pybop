[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pybop"
version = "0.1.0"
description = "Bayesian optimization with Gaussian processes with the ability to handle periodic dimensions"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
authors = [
  { name = "Gonzalo Morras", email = "gonzalo.morras@aei.mpg.de" }
]
keywords = ["bayesian optimization", "gaussian process", "optimization", "numpy", "scipy"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "License :: OSI Approved :: Apache Software License",
  "Operating System :: OS Independent",
  "Intended Audience :: Science/Research",
  "Topic :: Scientific/Engineering",
]

dependencies = ["numpy", "scipy"]

[project.optional-dependencies]
plotting = ["matplotlib"]

[project.urls]
Homepage = "https://github.com/gmorras/pybop"
Repository = "https://github.com/gmorras/pybop"

[tool.setuptools.packages.find]
where = ["."]
